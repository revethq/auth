quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${REVET_AUTH_DATABASE_USERNAME}
%prod.quarkus.datasource.password=${REVET_AUTH_DATABASE_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${REVET_AUTH_DATABASE_JDBC_URL}
%dev.quarkus.datasource.username=revet-auth
%dev.quarkus.datasource.password=revet-auth
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/revet-auth
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.min-size=2
quarkus.hibernate-orm.schema-management.strategy=validate
%dev.quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.hibernate-orm.unsupported-properties."hibernate.type.json_format_mapper"=com.revethq.auth.persistence.config.KotlinJsonFormatMapper
%dev.quarkus.live-reload.instrumentation=true

#quarkus.hibernate-orm.log.sql=${REVET_AUTH_LOG_SQL:false}

# Native image: defer Hibernate JSON-B integration init to runtime (Yasson not on runtime classpath)
quarkus.native.additional-build-args=--initialize-at-build-time=kotlin,\
  --initialize-at-run-time=org.hibernate.type.format.jakartajson.JakartaJsonIntegration