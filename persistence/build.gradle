plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm'
    id 'io.quarkus'
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")

    implementation 'io.quarkus:quarkus-kotlin'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'

    implementation project(path: ':core')

    implementation 'jakarta.json.bind:jakarta.json.bind-api:3.0.1'

    // JSON Schema validation (native-image compatible, same Vert.x version as Quarkus)
    implementation 'io.vertx:vertx-json-schema:4.5.24'

    implementation 'io.quarkus:quarkus-arc'

    // Testing
    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'org.eclipse:yasson:3.0.3'

    implementation 'io.quarkus:quarkus-hibernate-orm-panache-common'
    implementation 'io.quarkus:quarkus-hibernate-orm-panache'
    implementation 'io.quarkus:quarkus-jdbc-postgresql'

    // Jackson for Hibernate JSON column serialization
    implementation 'io.quarkus:quarkus-jackson'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // JOSE
    implementation 'io.quarkus:quarkus-smallrye-jwt-build'

    // Security (password hashing) — provided transitively by Quarkus security stack
    implementation 'io.quarkus:quarkus-elytron-security-common'

    // Kotlin Coroutines for parallel SCIM delivery
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // Quarkus Scheduler for SCIM polling processor
    implementation 'io.quarkus:quarkus-scheduler'
}

group 'com.revethq.auth'
version '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

kotlin {
    jvmToolchain(25)
}

sourceSets {
    main {
        kotlin {
            srcDirs = ['src/main/kotlin']
        }
        java {
            srcDirs = ['src/main/java']
        }
    }
    test {
        kotlin {
            srcDirs = ['src/test/kotlin']
        }
        java {
            srcDirs = ['src/test/java']
        }
    }
}

test {
    systemProperty "java.util.logging.manager", "org.jboss.logmanager.LogManager"
}

